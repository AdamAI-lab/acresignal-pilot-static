services:
  - type: web
    name: acresignal
    runtime: static
    buildCommand: "echo prebuilt static artifact"
    staticPublishPath: .
    previews:
      generation: automatic
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://services.arcgisonline.com https://*.arcgisonline.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.opentopomap.org https://s3.amazonaws.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://services.arcgisonline.com https://*.arcgisonline.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.opentopomap.org https://s3.amazonaws.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), browsing-topics=()"
